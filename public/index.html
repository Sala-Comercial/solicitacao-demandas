<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal de Demandas Internas</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #16233d;
        --navy-2: #1f3a5f;
        --line: #e3e7ef;
        --muted: #6b7280;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f6fa;
        color: #1c2536;
      }
      .container {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 24px;
      }
      .subtitle {
        color: var(--muted);
        margin: 0 0 24px;
        font-size: 14px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 22px;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(2, 1fr);
      }
      .field.full {
        grid-column: 1 / -1;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
        color: #344054;
      }
      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #cfd6e4;
        border-radius: 9px;
        padding: 11px 12px;
        font-size: 14px;
        background: #fff;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--navy-2);
        box-shadow: 0 0 0 3px rgba(31, 58, 95, 0.12);
      }
      textarea {
        min-height: 150px;
        resize: vertical;
      }
      .record-box {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        background: #fbfcfe;
      }
      .record-btn {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        border: 0;
        background: var(--navy);
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        padding: 11px 20px;
        border-radius: 9px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .record-btn:hover {
        background: var(--navy-2);
      }
      .record-btn.recording {
        background: #b42318;
      }
      .record-btn .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ff5c5c;
      }
      .record-btn.recording .dot {
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      .hint {
        color: var(--muted);
        font-size: 13px;
        margin-top: 10px;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 24px;
      }
      .btn {
        border-radius: 9px;
        padding: 12px 26px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
      }
      .btn-secondary {
        background: #fff;
        border-color: #cfd6e4;
        color: #344054;
      }
      .btn-primary {
        background: var(--navy);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--navy-2);
      }
      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .result {
        margin-top: 16px;
        padding: 13px 14px;
        border-radius: 9px;
        font-size: 14px;
        white-space: pre-wrap;
        display: none;
      }
      .result.show {
        display: block;
      }
      .ok {
        background: #e8f6ec;
        color: #1b6130;
      }
      .error {
        background: #fde9ec;
        color: #8f2130;
      }
      @media (max-width: 620px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Solicitar Demanda</h1>
      <p class="subtitle">Abra uma demanda para o time. Cada envio cria automaticamente uma task no ClickUp.</p>

      <section class="card">
        <form id="demandForm">
          <div class="grid">
            <div class="field">
              <label for="title">Titulo *</label>
              <input id="title" name="title" required />
            </div>
            <div class="field">
              <label for="priority">Prioridade</label>
              <select id="priority" name="priority">
                <option value="baixa">Baixa</option>
                <option value="media" selected>Media</option>
                <option value="alta">Alta</option>
                <option value="urgente">Urgente</option>
              </select>
            </div>
            <div class="field">
              <label for="requester">Solicitante *</label>
              <input id="requester" name="requester" required />
            </div>
            <div class="field">
              <label for="area">Area *</label>
              <input id="area" name="area" required />
            </div>
            <div class="field">
              <label for="team">Time destino *</label>
              <input id="team" name="team" required />
            </div>
            <div class="field">
              <label for="contact">Contato</label>
              <input id="contact" name="contact" />
            </div>
            <div class="field">
              <label for="dueDate">Prazo desejado</label>
              <input id="dueDate" name="dueDate" placeholder="AAAA-MM-DD ou texto livre" />
            </div>
          </div>

          <div class="field full" style="margin-top: 16px">
            <label>Gravacao</label>
            <div class="record-box">
              <button type="button" id="recordBtn" class="record-btn">
                <span class="dot"></span>
                <span id="recordLabel">GRAVAR</span>
              </button>
              <p class="hint" id="recordHint">Grave um audio para transcrever automaticamente na Descricao.</p>
            </div>
          </div>

          <div class="field full" style="margin-top: 16px">
            <label for="description">Descricao</label>
            <textarea id="description" name="description" placeholder="Descreva a demanda ou grave um audio acima."></textarea>
          </div>

          <div class="actions">
            <button type="reset" class="btn btn-secondary" id="cancelBtn">CANCELAR</button>
            <button type="submit" class="btn btn-primary" id="submitBtn">REGISTRAR</button>
          </div>
        </form>

        <div id="result" class="result"></div>
      </section>
    </main>

    <script>
      const form = document.getElementById("demandForm");
      const result = document.getElementById("result");
      const recordBtn = document.getElementById("recordBtn");
      const recordLabel = document.getElementById("recordLabel");
      const recordHint = document.getElementById("recordHint");
      const descriptionEl = document.getElementById("description");
      const submitBtn = document.getElementById("submitBtn");

      let mediaRecorder = null;
      let chunks = [];
      let recordedBlob = null;

      function showMessage(type, message) {
        result.className = `result show ${type}`;
        result.textContent = message;
      }

      function setHint(text) {
        recordHint.textContent = text;
      }

      async function startRecording() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          chunks = [];

          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) chunks.push(event.data);
          };

          mediaRecorder.onstop = async () => {
            stream.getTracks().forEach((track) => track.stop());
            recordedBlob = new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" });
            await transcribeRecording();
          };

          mediaRecorder.start();
          recordBtn.classList.add("recording");
          recordLabel.textContent = "PARAR";
          setHint("Gravando... clique em PARAR quando terminar.");
        } catch (error) {
          showMessage("error", `Nao foi possivel acessar o microfone: ${error.message}`);
        }
      }

      function stopRecording() {
        if (mediaRecorder && mediaRecorder.state === "recording") {
          mediaRecorder.stop();
          recordBtn.classList.remove("recording");
          recordLabel.textContent = "GRAVAR";
        }
      }

      async function transcribeRecording() {
        if (!recordedBlob) return;
        setHint("Transcrevendo audio...");
        recordBtn.disabled = true;

        const data = new FormData();
        data.append("audio", recordedBlob, "gravacao.webm");

        try {
          const response = await fetch("/api/transcribe", { method: "POST", body: data });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.details || payload.error || "Falha na transcricao");
          }

          const transcript = (payload.text || "").trim();
          if (!transcript) {
            setHint("Nenhuma fala detectada no audio. Tente novamente.");
            return;
          }

          descriptionEl.value = descriptionEl.value
            ? `${descriptionEl.value}\n\n${transcript}`
            : transcript;
          setHint("Transcricao adicionada a Descricao. Voce pode editar antes de registrar.");
        } catch (error) {
          setHint("Falha ao transcrever.");
          showMessage("error", `Erro na transcricao: ${error.message}`);
        } finally {
          recordBtn.disabled = false;
        }
      }

      recordBtn.addEventListener("click", () => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
          stopRecording();
        } else {
          startRecording();
        }
      });

      form.addEventListener("reset", () => {
        recordedBlob = null;
        result.className = "result";
        setHint("Grave um audio para transcrever automaticamente na Descricao.");
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitBtn.disabled = true;
        showMessage("ok", "Registrando demanda...");

        const data = new FormData(form);
        if (recordedBlob) {
          data.append("audio", recordedBlob, "gravacao.webm");
        }

        try {
          const response = await fetch("/api/requests", { method: "POST", body: data });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.details || payload.error || "Falha inesperada");
          }

          const lines = [
            `Protocolo: ${payload.protocol}`,
            `Task criada: ${payload.clickupTaskId}`,
            payload.clickupTaskUrl ? `Link: ${payload.clickupTaskUrl}` : null,
            payload.duplicated ? "(Solicitacao ja existente - evitada duplicidade)" : null
          ].filter(Boolean);

          showMessage("ok", lines.join("\n"));
          if (!payload.duplicated) {
            form.reset();
            recordedBlob = null;
          }
        } catch (error) {
          showMessage("error", `Erro ao registrar: ${error.message}`);
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
